# E2, the positive control: a short RL run on a reward the policy can raise with the tools it has (its army at minute
# 10, z-scored per opponent), 12-minute games against Petra-1 and Petra-2. The frozen-v0 arm plays beside it as the
# `control-v0` panel on the same kind of games. The adapters it publishes stay in this root and are never used again.
# Second attempt (9 Nov): its own root and prefix, so the first attempt's files (s2-e2) stay as they were.
# Third attempt (14 Nov): drift outside v0's bands only alarms ([e2] drift in sequence.toml), and 3 h, so about 20
# updates run at the full lr after the learner's 10-update warmup (the second attempt had 2 before its first rollback).
run_id = "s2-e2c"
root = "/var/lib/zeroad-live/train/s2/e2c"
duration_hours = 3
budget_usd = 600            # LIVE_BUDGET_USD: box hours (the whole box's, counted once) plus frontier spend; every step's stops at it
box_usd_per_hour = 10.49    # g6e.12xlarge; 15.07 for a g6e.24xlarge. s2.sh start refuses it if the box's own rate differs.
shutdown = false            # the sequence powers the box off itself, once, after the final upload
engines = 24
concurrency = 24
seed = 1

[servers]
urls = ["http://172.17.0.1:8000", "http://172.17.0.1:8001"]

[mix]
petra-1 = 0.5
petra-2 = 0.5

[games]
time_cap_minutes = 12
no_cap_share = 0.0
interface = "v2"
score_rule = "net_worth"
maps = ["mainland"]

# None of these appears in a training game; the panels draw from them. No held-out map yet: one that passes the bot
# smoke test goes in `maps`; until then the panels take the training map with held-out seeds and civ pairs.
[held_out]
civ_pairs = [["rome", "pers"], ["athen", "cart"]]
maps = []
seed_ranges = [[900000, 900500]]

[credit]
positive_control = true      # the reward is the army at minute 10

[[panels]]
name = "control-v0"
kind = "heldout"
at_hours = 0
version = 0
games = 60
positions = "training"
time_cap_minutes = 12
opponents = { "petra-1" = 0.5, "petra-2" = 0.5 }

[s3]
uri = "s3://BUCKET/zeroad-train/run/s2-e2c"
