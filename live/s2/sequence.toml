# The S2 + Run 1 sequence (src/agentenv_zeroad/train/s2.py, docs/s2-box-day.md): where it keeps its files, where its own
# files go on S3, and each step's wall-clock cap and expected duration. `live/s2.sh ID start live/s2 --yes` sends this
# directory to the box. A key that is not in the tables below is an error. No secret goes here.
#
# cap_hours is a hard stop (SIGTERM, so an orchestrator uploads, then SIGKILL 40 minutes later); expected_hours is what
# the box's start check and the plan add up (the box's power-off deadline must leave their sum plus half an hour).
# The step configs name their own roots, which must all be under `root`, and every s3.uri; the s3://BUCKET/ in them
# becomes s3://LIVE_BUCKET/ when live/s2.sh sends them.

root = "/var/lib/zeroad-live/train/s2"

[s3]
uri = "s3://BUCKET/zeroad-train/run/s2"   # the sequence's own files: gates.json, logs, s2-report.json, labels, SFT epochs

[e1]                       # GPU gates
config = "e1.toml"
cap_hours = 0.75
expected_hours = 0.5
levels = [16, 32, 48, 64]  # calls in flight per vLLM server
window_s = 60              # seconds each level is held
rows = 48                  # sampled decisions kept for the learner's probe
min_decisions_per_s_per_gpu = 3.0
max_learner_s_per_decision = 2.0
max_logprob_gap = 0.05

[e2]                       # positive control
config = "e2.toml"
cap_hours = 2.6            # e2.toml's duration_hours (2) + its drain and upload
expected_hours = 2.3
control_panel = "control-v0"   # the frozen-v0 arm, a panel in e2.toml
window_games = 40          # the policy's last games that are compared with the control
min_games = 30             # in the smaller arm
min_median_army = 6.0
max_p = 0.01               # Mann-Whitney, one-sided
min_updates = 5
minute = 10.0

[baselines]                # play-only v0: panels, calibration, briefs
config = "baselines.toml"
cap_hours = 3.5
expected_hours = 2.6
min_finished_share = 0.9   # of each panel's games that must have finished
planned_usd = 45.0         # frontier spend the budget guard counts ahead: 20 baseline + 16 calibration games, with margin
heldout_panel = "heldout"
v1_panel = "heldout-v1"
frontier_panel = "frontier"
calibration_panel = "teacher-calibration"

[distill]                  # the labels (the SFT and its panels are the next two tables)
cap_hours = 1.0
expected_hours = 0.4
n = 3000
min_labels = 2400
cap_usd = 60.0             # the first teacher's SpendGuard cap
second_cap_usd = 8.0       # the label-noise check's
check = 200
per_game = 8
tokenizer = "Qwen/Qwen3-8B"
weights = "losing=0.6,late=0.2,rejected=0.2"

[sft]
config = "sft.toml"
cap_hours = 1.25
expected_hours = 0.8
epochs = 2
lr = 1e-4

[sft_panels]               # each epoch's adapter on the first panel_games of the held-out panel
config = "sft-panels.toml"
cap_hours = 2.0
expected_hours = 1.4
panel_games = 192
min_entropy_ratio = 0.7
min_games = 20
max_p = 0.05               # Run 1 starts from the chosen epoch only if it beats v0 at this one-sided level

[run1]
config = "run1.toml"
cap_hours = 11.0           # run1.toml's duration_hours (10) + its drain and final upload
expected_hours = 10.3
planned_usd = 30.0         # frontier spend: the end panels (20 games) with margin
heldout_panel = "end-heldout"
frontier_panel = "end-frontier"
