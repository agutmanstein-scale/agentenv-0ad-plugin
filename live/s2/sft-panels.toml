# Each SFT epoch's adapter plays the first `panel_games` of the held-out panel (play-only, panels only). The sequence
# appends one [[panels]] table per epoch, named sft-epoch1, sft-epoch2 ..., pinned to that epoch's adapter version, and
# writes the result to ROOT/generated/sft-panels.toml. Then the chosen epoch plays the remaining held-out configs as a
# panel named sft-rest (`start` = panel_games), from ROOT/generated/sft-rest.toml: this file plus that one panel. Same
# root as sft.toml, so the epochs and the panels are read together. duration_hours bounds each of the two runs.
panels_only = true
stop_when_done = true
run_id = "s2-sft-panels"
root = "/var/lib/zeroad-live/train/s2/sft"
duration_hours = 2
budget_usd = 600            # LIVE_BUDGET_USD: the box's hours (counted once, whatever the step) plus frontier spend
box_usd_per_hour = 10.49    # g6e.12xlarge; 15.07 for a g6e.24xlarge. s2.sh start refuses it if the box's own rate differs.
shutdown = false            # the sequence powers the box off itself, once, after the final upload
engines = 24
concurrency = 24
seed = 1

[servers]
urls = ["http://172.17.0.1:8000", "http://172.17.0.1:8001"]

[games]
time_cap_minutes = 30
no_cap_share = 0.15
interface = "v2"
score_rule = "net_worth"
maps = ["mainland"]

# None of these appears in a training game; the panels draw from them. No held-out map yet: one that passes the bot
# smoke test goes in `maps`; until then the panels take the training map with held-out seeds and civ pairs.
[held_out]
civ_pairs = [["rome", "pers"], ["athen", "cart"]]
maps = []
seed_ranges = [[900000, 900500]]

[s3]
uri = "s3://BUCKET/zeroad-train/run/s2-sft"
