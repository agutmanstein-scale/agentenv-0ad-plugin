# E2's tripwire baseline: play-only v0 on E2's kind of games (12-minute games against Petra-1 and Petra-2), whose
# decisions, credited with E2's credit, the stats-only learner measures into ROOT/s2/baseline-e2.json. The
# baselines' 30-minute games band v0 differently: on E2's games v0 itself tripped the distinct-completion band.
run_id = "s2-e2-baseline"
root = "/var/lib/zeroad-live/train/s2/e2-baseline"
duration_hours = 0.75        # ~360 games at E2's ~490 an hour: ~3,600 decisions, 10 needed records are 2,560
budget_usd = 600            # LIVE_BUDGET_USD: box hours (the whole box's, counted once) plus frontier spend; every step's stops at it
box_usd_per_hour = 10.49    # g6e.12xlarge; 15.07 for a g6e.24xlarge. s2.sh start refuses it if the box's own rate differs.
shutdown = false            # the sequence powers the box off itself, once, after the final upload
engines = 24
concurrency = 24
seed = 2                     # a stream of its own, not E2's first games

[servers]
urls = ["http://172.17.0.1:8000", "http://172.17.0.1:8001"]

[mix]
petra-1 = 0.5
petra-2 = 0.5

[games]
time_cap_minutes = 12
no_cap_share = 0.0
interface = "v2"
score_rule = "net_worth"
maps = ["mainland"]

# None of these appears in a training game; the panels draw from them. No held-out map yet: one that passes the bot
# smoke test goes in `maps`; until then the panels take the training map with held-out seeds and civ pairs.
[held_out]
civ_pairs = [["rome", "pers"], ["athen", "cart"]]
maps = []
seed_ranges = [[900000, 900500]]

[credit]
positive_control = true      # the reward is the army at minute 10

[s3]
uri = "s3://BUCKET/zeroad-train/run/s2-e2-baseline"
