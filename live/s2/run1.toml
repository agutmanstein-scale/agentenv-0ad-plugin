# Run 1: train Qwen to win games. 8 hours of RL from the base model (or from the distilled SFT adapter when it beat v0,
# which the step publishes into this root as version 1), on the documented objective: R = +1 for a conquest won, -1 for
# one lost, and at the 30-minute cap the net-worth rule R = cap_weight (0.5 sign(m) + 0.5 tanh(m / s)) with cap_weight 1,
# so a lead at the cap counts as a win. 15% of the games run uncapped (to the 45-minute safety stop). The mix is Run 1's
# fixed one. s is not set here: step_run1 renders this file into ROOT/s2/generated/run1.toml with the margin scale e4_check
# measured on v0's 30-minute games (and init_version 1 when it starts from an SFT adapter).
# Credit is E4's with a bigger share of each game: each start dealt 4 times (the start's other games the baseline), whole
# groups per update, 16 to 24 decisions per seat-game (the default 8 to 12 starved E4's learner on long games: 12 updates in
# 3.5 h, the learner busy 49% of the time).
# The end panels start at train_hours, after the learner has stopped, and play the very starts of baselines.toml's
# `heldout` panel (same seed, positions, opponent mix, start, games and time cap): `end-base` is v0 and `end-final` the
# adapter current then, so each pairs game by game with the other and with v0's earlier 384 games.
run_id = "s2-run1"
root = "/var/lib/zeroad-live/train/s2/run1"
duration_hours = 12.3       # train_hours + the two end panels (768 games of 30 minutes at about 200 an hour, 3.9 h) + drains and uploads
train_hours = 8
init_version = 0            # the base model; 1 starts from the SFT adapter, which the step publishes as version 1 in this root
budget_usd = 920            # LIVE_BUDGET_USD: the box's hours (counted once, whatever the step) plus frontier spend
box_usd_per_hour = 10.49    # g6e.12xlarge; 15.07 for a g6e.24xlarge. s2.sh start refuses it if the box's own rate differs.
shutdown = false            # the sequence powers the box off itself, once, after the final upload
stop_when_done = true       # the run ends, reason "complete", when both end panels are played
engines = 24
concurrency = 24
seed = 1

[servers]
urls = ["http://172.17.0.1:8000", "http://172.17.0.1:8001"]

# Run 1's fixed mix; the frozen base model ("base") is v0.
[mix]
bot = 0.10
petra-1 = 0.35
petra-2 = 0.35
petra-3 = 0.10
base = 0.10

[games]
time_cap_minutes = 30
no_cap_share = 0.15
interface = "v2"
score_rule = "net_worth"
maps = ["mainland"]
seed_group = 4               # each start (opponent, civs, slot, map, seeds) is dealt 4 times in a row: credit's baseline group

# None of these appears in a training game; the panels draw from them. No held-out map yet: one that passes the bot
# smoke test goes in `maps`; until then the panels take the training map with held-out seeds and civ pairs.
[held_out]
civ_pairs = [["rome", "pers"], ["athen", "cart"]]
maps = []
seed_ranges = [[900000, 900500]]

[credit]
positive_control = false     # the reward is the game's outcome
margin_scale = 5000.0        # s in tanh(m / s): a placeholder, replaced by step_run1 with e4_check's measured margin_scale
cap_weight = 1.0             # the documented rule: a lead at the cap is a full win
baseline = "start_loo"       # A = R - the mean R of the start's other games; every decision of a game shares it
group_size = 4               # = games.seed_group
decisions_per_update = 512   # the learner's batch (--decisions-per-update in sequence.toml's [run1] must match)
decisions = [16, 24]         # trained per seat-game, drawn uniformly per game

# [hard_states]               # teacher labels on opponents the policy loses to every time; off unless enabled
# enabled = true
# calibration = "/var/lib/zeroad-live/train/s2/baselines/panels/teacher-calibration"   # the baselines' panel

# The two end panels play the baselines' `heldout` panel's starts exactly (the default opponent mix, the same seed 1 and the
# 384 games from index 0): only the policy differs. `end-final` plays the last adapter the learner published.
[[panels]]
name = "end-base"
kind = "heldout"
at_hours = 8
version = 0                  # base Qwen, the frozen model
games = 384

[[panels]]
name = "end-final"
kind = "heldout"
at_hours = 8
games = 384

[s3]
uri = "s3://BUCKET/zeroad-train/run/s2-run1"
